services:
  - type: web
    name: carecompanion
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: carecompanion-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@carecompanion.app
      - key: MISSED_DOSE_GRACE_MINUTES
        value: "120"
      - key: INVITE_CODE_EXPIRY_HOURS
        value: "24"
      - key: LOG_LEVEL
        value: info
      - key: SEED_ON_START
        value: "true"

databases:
  - name: carecompanion-db
    databaseName: carecompanion
    user: carecompanion
    plan: starter
